name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: go test ./...
      - run: go vet ./...
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - run: wails3 build ARCH=amd64
      - uses: actions/upload-artifact@v4
        with:
          name: claudepro-windows-x64
          path: bin/claudepro.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: go test ./...
      - run: go vet ./...
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - run: wails3 task darwin:package:universal
      - name: Verify universal binary
        run: |
          archs=$(lipo -archs bin/claudepro.app/Contents/MacOS/claudepro)
          echo "$archs"
          echo "$archs" | grep -qw x86_64 && echo "$archs" | grep -qw arm64
      - name: Zip app bundle for in-app updates
        run: ditto -c -k --keepParent bin/claudepro.app bin/claudepro-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: claudepro-macos-universal
          path: |
            bin/ClaudePro-macos-universal.dmg
            bin/claudepro-macos-universal.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches config version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(awk '/^  version:/{gsub(/"/,"",$2); print $2; exit}' build/config.yml)
          test "$tag" = "$ver"
      - uses: actions/download-artifact@v4
      - name: Checksums
        run: |
          mkdir dist
          cp claudepro-windows-x64/claudepro.exe dist/
          cp claudepro-macos-universal/ClaudePro-macos-universal.dmg dist/
          cp claudepro-macos-universal/claudepro-macos-universal.zip dist/
          cd dist
          sha256sum claudepro.exe > claudepro.exe.sha256
          sha256sum claudepro.exe ClaudePro-macos-universal.dmg claudepro-macos-universal.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/claudepro.exe dist/claudepro.exe.sha256 dist/ClaudePro-macos-universal.dmg dist/claudepro-macos-universal.zip dist/SHA256SUMS --generate-notes --prerelease
