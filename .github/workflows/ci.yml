name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # Bootstrap embedded assets before Go/Wails scans main.go on a fresh clone.
      - run: npm run build --prefix frontend
      - run: go test ./...
      - run: go vet ./...
      - run: npm run typecheck --prefix frontend
      - run: npx --no-install playwright test
        working-directory: frontend
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - run: wails3 build ARCH=amd64
      - uses: actions/upload-artifact@v4
        with:
          name: claudepro-windows-x64
          path: bin/claudepro.exe
